
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
<style>
@media (max-width: 900px) {
  .card-form, .modern-form-container {
    width: 95% !important;
    margin: 10px auto !important;
    padding: 10px !important;
  }
  .form-fields, .input-row {
    flex-direction: column !important;
    width: 100% !important;
    gap: 0 !important;
  }
  .input-container {
    width: 100% !important;
    margin-bottom: 10px !important;
  }
}
@media (max-width: 600px) {
  .navbar, #nav {
    flex-direction: column !important;
    height: auto !important;
    padding: 10px !important;
  }
  .nav-links {
    flex-direction: column !important;
    width: 100% !important;
    align-items: flex-start !important;
  }
  .nav-link {
    margin: 5px 0 !important;
    font-size: 16px !important;
  }
  .showcase {
    padding: 10px !important;
    font-size: 16px !important;
  }
  .card-form, .modern-form-container {
    width: 100% !important;
    padding: 5px !important;
  }
  .form-title {
    font-size: 18px !important;
  }
  .btn, .full-width-btn {
    width: 100% !important;
    font-size: 16px !important;
    padding: 10px !important;
  }
}
</style>
<link href="{{ url_for('static', filename='styles/all.css', id=id) }}" rel="stylesheet">
     <script src="{{ url_for('static', filename='scripts/all.js', id=id) }}"></script>

</head>
<body>

  <nav id="nav" class="navbar modern-navbar">
    <div class="nav-brand modern-nav-brand">
      <i class="fa fa-cloud-sun fa-lg"></i>
      <span>Weather Whisper</span>
    </div>
    <ul class="nav-links modern-nav-links">
      <li><a href="" class="nav-link modern-nav-link">Search Weather</a></li>
      <li><a href="{{ url_for('subscribe') }}" class="nav-link modern-nav-link active">Subscribe</a></li>
      <li><a href="#" class="nav-link modern-nav-link">Contact Us</a></li>
    </ul>
  </nav>

	<div class="showcase">
    <div class="showcase modern-showcase">
      <h2 class="showcase-title modern-showcase-title">Get weather info the easy way</h2>
      <p class="showcase-desc modern-showcase-desc">Subscribe to get daily weather info of your location via SMS at 6 AM</p>
    </div>
	</div>

<form action="{{ url_for('validate_form')}}" style="max-width:500px;margin:auto" method="post", enctype="multipart/form-data">
  <div class="modern-form-container card-form responsive-form">
    <h2 class="form-title modern-form-title"><i class="fa fa-envelope-open-text"></i> Subscribe for Daily Weather</h2>
    <div class="form-fields">
      <div class="form-fields responsive-fields">
        <div class="input-row responsive-row">
        <div class="input-row responsive-row">
          <div class="input-container modern-input responsive-input">
          <i class="fa fa-user icon"></i>
          <input class="input-field modern-input-field" type="text" placeholder="Username" name="user_name">
        </div>
        <div class="input-row responsive-row">
          <div class="input-container modern-input responsive-input">
          <i class="fa fa-phone icon"></i>
          <input class="input-field modern-input-field" type="text" placeholder="Phone" name="phone_number">
        </div>
      </div>
      <div class="input-row">
        <div class="input-container modern-input">
          <i class="fa fa-flag icon"></i>
          <input class="input-field modern-input-field" type="text" placeholder="Country" name="country">
        </div>
        <div class="input-container modern-input">
          <i class="fa fa-city icon"></i>
          <input class="input-field modern-input-field" type="text" placeholder="City" name="city">
        </div>
      </div>
      <div class="input-row">
        <div class="input-container modern-input">
          <i class="fa fa-user icon"></i>
          <input class="input-field modern-input-field" type="text" placeholder="Gender" name="gender">
        </div>
      </div>
    </div>
    <button type="submit" class="btn modern-btn full-width-btn"><i class="fa fa-paper-plane"></i> Register</button>
    <a href="{{ url_for('homepage') }}" class="goBack modern-back"><i class="fa fa-arrow-left"></i> Go Back</a>
  </div>
</form>
</body>
</html>
